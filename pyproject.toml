[project]
name = "mojo-implicit"
version = "0.1.0"
description = "ALS and BPR implicit-feedback matrix factorization kernels in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "recommendation", "matrix-factorization", "implicit-feedback"]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "implicit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
